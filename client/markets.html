<!DOCTYPE html>
<!-- Markets page: provide empty UI containers that markets.js fills, filters, sorts and updates. -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Use the device width so responsive CSS follows phone/tablet sizes rather than a desktop-sized canvas. -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Browse NSE stocks and current Yahoo Finance prices.">
  <title>Markets - StockPie</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <!-- Load shared colors, typography and layout first; pages.css adds component and inner-page rules. -->
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="pages.css">
  <link rel="stylesheet" href="experience.css">
</head>
<!-- main.js uses this page identifier to underline the matching shared navigation link. -->
<body data-page="markets">

  <!-- The Node server replaces the following marker with server/partials/header.html; use HTTP to see it. -->
  <!-- shared:header -->

  <main class="container page">
    <p class="eyebrow">Discover opportunity</p>
    <h1 class="page-title">Explore markets</h1>
    <p class="page-sub">Browse supported NSE stocks and their latest Yahoo Finance prices.</p>

    <label class="search-box" for="marketSearch">
      <span aria-hidden="true">&#9906;</span>
      <input type="search" id="marketSearch" placeholder="Search NSE stocks..." autocomplete="off">
    </label>

    <div class="market-tools">
      <button type="button" class="btn btn-dark btn-small" id="resetMarkets">Reset filters</button>
    </div>

    <section class="table-card">
      <div class="table-head">
        <h3>Market universe</h3>
        <p class="tiny-note">INR prices · click a column to sort</p>
      </div>
      <div class="table-scroll">
        <table>
          <thead>
            <tr>
              <th data-sort="name" aria-sort="ascending">Asset <span class="sort-arrow">▲</span></th>
              <th>Ticker</th>
              <th data-sort="price">Price <span class="sort-arrow">▲</span></th>
              <th data-sort="changePct">Daily change <span class="sort-arrow">▲</span></th>
              <th>Quote time (IST)</th>
            </tr>
          </thead>
          <!-- markets.js filters, sorts and displays rows whenever an input changes. -->
          <tbody id="marketBody"></tbody>
        </table>
      </div>
      <div class="table-foot">
        <span id="marketCount" aria-live="polite">Loading assets…</span>
        <a href="market-overview.html" class="link-small">View market overview &rarr;</a>
      </div>
    </section>
  </main>

  <!-- The server inserts one shared footer here, with the shared navigation links. -->
  <!-- shared:footer -->

  <!-- Load order matters: shared catalog, UI and storage must be available before the page controller runs. -->
  <!-- Shared helpers provide form requests, formatting, charts and dialogs; load them before page-specific code. -->
  <script src="js/shared/api.js"></script>
  <script src="js/shared/ui.js"></script>
  <script src="js/shared/main.js"></script>
  <script src="js/pages/markets.js"></script>
  <script src="js/shared/experience.js"></script>
</body>
</html>
